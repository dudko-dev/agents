packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'

# Dependency install scripts are off unless listed here. esbuild and nx need theirs; onnxruntime-node
# (a native runtime the browser demo never loads) and protobufjs do not.
onlyBuiltDependencies:
  - esbuild
  - nx

# nx starts several `pnpm run` at once. With this check on (some environments enable it globally),
# they race on pnpm's workspace-state file and one fails with "Unexpected end of JSON input".
verifyDepsBeforeRun: false
