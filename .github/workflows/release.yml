name: Release

# Publishes every package whose version in packages/*/package.json is not on npm yet. A release is
# made by bumping a package's version in a pull request; this workflow does the rest once CI has
# passed on main. Packages are versioned and published independently.
#
# npm Trusted Publishing (Settings -> Trusted Publisher of each package on npmjs.com) must point at
# this repository, this workflow file name (`release.yml`) and the `release` environment below.
on:
  workflow_run:
    # Only commits that already passed CI on main are published.
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or commit SHA to publish from. Empty = main HEAD.'
        type: string
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: What to publish
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      agent: ${{ steps.plan.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.event.workflow_run.head_sha || github.ref }}
      - id: plan
        run: node .github/scripts/release-plan.mjs >>"$GITHUB_OUTPUT"

  # The Node agent is published only after a run against a REAL model, served locally on the
  # runner (no key, no hosted API). CI proves the code against a scripted model; this proves it
  # against one that has opinions, at the moment that question is worth asking.
  live-model:
    name: Live model
    needs: plan
    if: needs.plan.outputs.agent == 'true'
    uses: ./.github/workflows/live-model.yml
    with:
      ref: ${{ inputs.ref != '' && inputs.ref || github.event.workflow_run.head_sha || github.ref }}

  publish:
    name: Publish ${{ matrix.package.name }}@${{ matrix.package.version }}
    runs-on: ubuntu-latest
    needs: [plan, live-model]
    # `always()` so that a skipped live-model job (nothing of the Node agent to publish) does not
    # skip this one; a failed or cancelled plan still does.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true'
    environment: release
    permissions:
      # Push the version tag and create the GitHub release.
      contents: write
      # npm provenance + the Trusted Publishing OIDC exchange.
      id-token: write
    strategy:
      fail-fast: false
      # One at a time, in the order of the plan (the core before what peers on it).
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: The Node agent needs a green live-model run
        if: matrix.package.dir == 'agent' && needs.live-model.result != 'success'
        run: |
          echo "::error::not publishing ${{ matrix.package.name }}: the live-model smoke test is '${{ needs.live-model.result }}'"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.event.workflow_run.head_sha || github.ref }}
          # Full history so the tag can be pushed.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The checks already ran in CI for this commit; build what is published (and what it needs).
      - run: pnpm nx build ${{ matrix.package.name }}

      # `pnpm pack` writes the tarball that gets published: it replaces `workspace:*` with real
      # versions, which `npm publish` on the directory would not.
      - name: Pack
        id: pack
        working-directory: packages/${{ matrix.package.dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-assets"
          TARBALL=$(ls "$GITHUB_WORKSPACE"/release-assets/*.tgz)
          if tar -xzOf "$TARBALL" package/package.json | grep -q '"workspace:'; then
            echo "::error::the packed manifest still has a workspace: dependency"
            exit 1
          fi
          echo "tarball=$TARBALL" >>"$GITHUB_OUTPUT"

      # Preferred: npm Trusted Publishing (OIDC), no secret needed. Fallback: the NPM_TOKEN secret -
      # npm only reads a token from .npmrc, so write it explicitly, and only when the secret is set
      # (an empty _authToken breaks OIDC). npm 11.5.1+ is what speaks Trusted Publishing.
      - name: Publish to npm
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >>"$HOME/.npmrc"
            echo "::notice::Publishing with the NPM_TOKEN secret (fallback)."
          else
            echo "::notice::No NPM_TOKEN secret; relying on npm Trusted Publishing (OIDC)."
          fi
          npx -y npm@11.5.1 publish "${{ steps.pack.outputs.tarball }}" --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The browser core also ships its standalone bundle as a release asset (see its README).
      - name: Standalone bundle asset
        if: matrix.package.dir == 'agent-web'
        run: |
          set -euo pipefail
          V="${{ matrix.package.version }}"
          cp packages/agent-web/dist/agent-web.js "release-assets/agent-web-$V.min.js"
          cp packages/agent-web/dist/agent-web.js.map "release-assets/agent-web-$V.min.js.map"

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists; skipping."
            exit 0
          fi
          git config user.name "Siarhei Dudko"
          git config user.email "siarhei@dudko.dev"
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "${{ matrix.package.name }} ${{ matrix.package.version }}"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --title "${{ matrix.package.name }} ${{ matrix.package.version }}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)" \
            release-assets/*
