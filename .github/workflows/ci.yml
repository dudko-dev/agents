name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets a maintainer re-run the suite from the Actions tab without pushing.
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every package and the demo: typecheck, format, build, unit + integration tests. nx orders
      # them by the dependency graph (a package's dist is built before what consumes it).
      - run: pnpm nx run-many -t typecheck format:check build test

  e2e:
    name: Browser (demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dudko.dev/agent-web-react exec playwright install --with-deps chromium
      # Builds the libraries and the demo first, then runs the flows only a real browser covers.
      - run: pnpm nx run @dudko.dev/agent-web-react:test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/agent-web-react/test-results/
          retention-days: 7
