name: Autoupdate
on:
  schedule:
    - cron: "0 23 * * 5"
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
env:
  AUTOUPDATE_BRANCH: chore/autoupdate-${{ github.run_id }}
jobs:
  update:
    name: Autoupdate dependencies
    # Only where the packages live: a fork has no business opening release PRs.
    if: github.repository == 'dudko-dev/agents'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.email "siarhei@dudko.dev"
          git config user.name "Siarhei Dudko"
      - name: Create autoupdate branch
        run: |
          git checkout -b "$AUTOUPDATE_BRANCH"
          git push -u origin "$AUTOUPDATE_BRANCH"
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm update -r --latest` over the whole workspace; a published package whose own
      # `dependencies` changed gets a patch bump and a CHANGELOG entry (so it is released), a
      # dev-only or lockfile-only change is committed without a release. See the script.
      - name: Update dependencies
        id: update
        run: node .github/scripts/autoupdate.mjs >>"$GITHUB_OUTPUT"
      - name: Commit and push the update
        id: push
        if: steps.update.outputs.updated == 'true'
        run: |
          git add -A
          git commit -m "chore(deps): autoupdate (${{ steps.update.outputs.title }})"
          git push origin "HEAD:$AUTOUPDATE_BRANCH"
      # The same four checks CI runs, here on one Node version: a red result sends the branch to
      # Claude straight away instead of waiting for CI to say the same.
      - name: Checks
        id: autoupdate
        if: steps.update.outputs.updated == 'true'
        continue-on-error: true
        run: pnpm nx run-many -t typecheck format:check build test

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create autoupdate --color "0e8a16" --description "Automated dependency update PRs" --force || true
          gh label create needs-claude --color "d4c5f9" --description "Needs Claude GitHub App to fix" --force || true
      - name: Detect diff vs main
        id: diff
        if: always()
        run: |
          git fetch origin main "$AUTOUPDATE_BRANCH"
          if git diff --quiet "origin/main" "origin/$AUTOUPDATE_BRANCH"; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR (autoupdater succeeded)
        id: pr_success
        if: steps.autoupdate.outcome == 'success' && steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<EOF
          Automated dependency update.

          - checks on the runner: green
          - released by this update: ${{ steps.update.outputs.bumped || 'nothing (no package dependencies changed)' }}

          CI must be green before merge.
          EOF
          )
          PR_URL=$(gh pr create \
            --base main \
            --head "$AUTOUPDATE_BRANCH" \
            --title "chore(deps): autoupdate (${{ steps.update.outputs.title }})" \
            --body "$BODY" \
            --assignee siarheidudko \
            --reviewer siarheidudko)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
      - name: Open PR (autoupdater failed)
        id: pr_failure
        if: steps.autoupdate.outcome == 'failure' && steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(cat <<EOF
          The dependency update did not pass the checks on the runner.

          Run log: $RUN_URL

          A Claude session has been dispatched to push fixes onto this branch
          so the following commands all exit 0:

                pnpm nx run-many -t typecheck format:check build test
                pnpm nx test:e2e @dudko.dev/agent-web-react

          Claude will leave a status comment on this PR when it finishes.
          The Claude workflow re-dispatches CI once it is done, so the
          checks below reflect its pushed fixes.
          EOF
          )
          PR_URL=$(gh pr create \
            --base main \
            --head "$AUTOUPDATE_BRANCH" \
            --title "chore(deps): autoupdate (needs claude fix)" \
            --body "$BODY" \
            --assignee siarheidudko \
            --reviewer siarheidudko)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
      - name: Trigger PR checks (GITHUB_TOKEN can't auto-trigger pull_request)
        if: steps.pr_success.outputs.pr_url != '' || steps.pr_failure.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref "$AUTOUPDATE_BRANCH" || true
          # The Node agent's real-model smoke test: dependency updates are where upstream drift
          # arrives. Its pull_request trigger does not fire for a GITHUB_TOKEN PR either.
          gh workflow run live-model.yml --ref "$AUTOUPDATE_BRANCH" || true
      - name: Wait for PR checks and merge (autoupdater succeeded)
        id: merge_pr
        if: steps.pr_success.outputs.pr_url != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr_success.outputs.pr_url }}
        run: |
          # Poll the check-runs API instead of `gh pr checks --watch`.
          # The pull_request run GitHub queues for a bot-authored PR is gated on
          # manual approval and sits in `action_required` forever. It surfaces in
          # the status rollup that `gh pr checks` reads, so `--watch` waited on a
          # check that can never complete and this step hung until the job timed
          # out, never reaching `gh pr merge`. Gated runs create no check runs, so
          # this view sees only jobs that actually execute -- among them the run
          # the previous step dispatched explicitly.
          SHA=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          for i in $(seq 1 40); do
            ALL=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --jq .check_runs)
            # Keep only the newest run of each check name. A check can appear
            # several times on one commit: autoupdate dispatches CI, then
            # claude.yml dispatches it again, and CI's concurrency group
            # cancels the earlier one. Those cancelled leftovers are not a
            # verdict on the code, but counting them lost a fully green PR.
            RUNS=$(jq 'group_by(.name) | map(max_by(.id))' <<<"$ALL")
            TOTAL=$(jq length <<<"$RUNS")
            PENDING=$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS")
            [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ] && break
            sleep 30
          done
          FAILED=$(jq '[.[] | select(.conclusion != null and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"$RUNS")
          echo "checks: total=$TOTAL pending=$PENDING failed=$FAILED"
          if [ "$TOTAL" -eq 0 ] || [ "$PENDING" -ne 0 ] || [ "$FAILED" -ne 0 ]; then
            echo "not merging: checks are not green"
            echo "ci_sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          gh pr merge "$PR_URL" --squash --delete-branch
          # GITHUB_TOKEN merges fire no `push` run, so CI never runs on main and
          # the release.yml chained to it never fires. Dispatch it directly;
          # it skips a version npm already has.
          MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq .mergeCommit.oid)
          gh workflow run release.yml --ref main -f ref="$MERGE_SHA"
          echo "dispatched release.yml for $MERGE_SHA"
      # The autoupdater proves an update only with its own command list on one
      # Node version, while CI also runs the test matrix and any extra jobs. An
      # update CI rejected used to stop here and sit open for good; hand it to
      # Claude together with the CI logs instead.
      - name: Dispatch Claude when CI rejects the update
        # ci_sha is set only when the checks were red, not when e.g. the
        # release dispatch after a successful merge failed.
        if: steps.merge_pr.outputs.ci_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr_success.outputs.pr_url }}
          CI_SHA: ${{ steps.merge_pr.outputs.ci_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR_URL" --add-label needs-claude || true
          gh workflow run claude.yml --ref main \
            -f branch="$AUTOUPDATE_BRANCH" \
            -f pr_url="$PR_URL" \
            -f run_url="$RUN_URL" \
            -f ci_sha="$CI_SHA"
      - name: Dispatch Claude to fix the failed autoupdate
        if: steps.pr_failure.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr_failure.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run claude.yml --ref main \
            -f branch="$AUTOUPDATE_BRANCH" \
            -f pr_url="$PR_URL" \
            -f run_url="$RUN_URL"
      - name: Add labels to PR
        if: steps.pr_success.outputs.pr_url != '' || steps.pr_failure.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr_success.outputs.pr_url || steps.pr_failure.outputs.pr_url }}
        run: |
          if [ "${{ steps.pr_failure.outputs.pr_url }}" != "" ]; then
            gh pr edit "$PR_URL" --add-label autoupdate --add-label needs-claude || true
          else
            gh pr edit "$PR_URL" --add-label autoupdate || true
          fi
      # Every run branches from main afresh, so an autoupdate PR that is still
      # open is strictly behind the one just opened. Close it instead of
      # letting a new one pile up on top each week.
      - name: Close autoupdate PRs superseded by this one
        if: steps.pr_success.outputs.pr_url != '' || steps.pr_failure.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr_success.outputs.pr_url || steps.pr_failure.outputs.pr_url }}
        run: |
          gh pr list --state open --base main \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/autoupdate-")) | select(.headRefName != env.AUTOUPDATE_BRANCH) | .number' |
          while read -r N; do
            echo "closing #$N, superseded by $PR_URL"
            gh pr close "$N" --delete-branch --comment "Superseded by $PR_URL." || true
          done
      - name: Cleanup branch when nothing to ship
        if: always() && steps.diff.outputs.has_diff != 'true'
        run: |
          git push origin --delete "$AUTOUPDATE_BRANCH" || true
