{{- /* Non-secret configuration, one ConfigMap per role (the gateway never sees the agent's). */ -}}
{{- $tls := include "swarm.temporalTls" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swarm.component" (list . "common") }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  PG_POOL_MAX: {{ .Values.pgPoolMax | quote }}
  TEMPORAL_ADDRESS: {{ include "swarm.temporalAddress" . | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
  TEMPORAL_TLS: {{ $tls | quote }}
  {{- with .Values.temporal.tls.serverName }}
  TEMPORAL_TLS_SERVER_NAME: {{ . | quote }}
  {{- end }}
  {{- if .Values.secrets.temporalTls.name }}
  TEMPORAL_TLS_CA_PATH: {{ printf "%s/temporal-ca.crt" (include "swarm.secretDir" dict) | quote }}
  {{- if .Values.secrets.temporalTls.clientCertificate }}
  TEMPORAL_TLS_CERT_PATH: {{ printf "%s/temporal-tls.crt" (include "swarm.secretDir" dict) | quote }}
  TEMPORAL_TLS_KEY_PATH: {{ printf "%s/temporal-tls.key" (include "swarm.secretDir" dict) | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swarm.component" (list . "gateway") }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
data:
  {{- $g := .Values.gateway }}
  GATEWAY_HOST: '0.0.0.0'
  GATEWAY_PORT: '8080'
  GATEWAY_AUTH: {{ $g.auth | quote }}
  CORS_ORIGINS: {{ $g.corsOrigins | quote }}
  GATEWAY_MAX_BODY_BYTES: {{ $g.maxBodyBytes | quote }}
  MESSAGE_MAX_CHARS: {{ $g.messageMaxChars | quote }}
  SSE_MAX_CONNECTIONS: {{ $g.sse.maxConnections | quote }}
  SSE_KEEPALIVE_MS: {{ $g.sse.keepAliveMs | quote }}
  SSE_BATCH: {{ $g.sse.batch | quote }}
  {{- $s := .Values.session }}
  SESSION_IDLE_TIMEOUT_MS: {{ $s.idleTimeoutMs | int64 | quote }}
  TURN_TIMEOUT_MS: {{ $s.turnTimeoutMs | int64 | quote }}
  TURN_HEARTBEAT_TIMEOUT_MS: {{ $s.heartbeatTimeoutMs | int64 | quote }}
  TURN_MAX_ATTEMPTS: {{ $s.maxTurnAttempts | quote }}
  SESSION_MAX_TURNS_PER_RUN: {{ $s.maxTurnsPerRun | quote }}
  SESSION_HISTORY_MAX_CHARS: {{ $s.historyMaxChars | int64 | quote }}
  SESSION_MAX_QUEUED_MESSAGES: {{ $s.maxQueuedMessages | quote }}
  SUBAGENT_MAX_PER_ROUND: {{ $s.subagentMaxPerRound | quote }}
  SUBAGENT_MAX_PER_SESSION: {{ $s.subagentMaxPerSession | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swarm.component" (list . "worker") }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
data:
  {{- $w := .Values.worker }}
  WORKER_MAX_CONCURRENT_TURNS: {{ $w.maxConcurrentTurns | quote }}
  WORKER_SHUTDOWN_GRACE_MS: {{ mul $w.shutdownGraceSeconds 1000 | int64 | quote }}
  WORKER_HEARTBEAT_THROTTLE_MS: {{ $w.heartbeatThrottleMs | quote }}
  WORKER_HEALTH_PORT: {{ $w.healthPort | quote }}
  LEASE_TTL_MS: {{ $w.leaseTtlMs | quote }}
  EVENT_MAX_BYTES: {{ $w.eventMaxBytes | quote }}
  {{- if $w.limiter.refillPerSecond }}
  LIMITER_REFILL_PER_SECOND: {{ $w.limiter.refillPerSecond | toString | quote }}
  {{- with $w.limiter.capacity }}
  LIMITER_CAPACITY: {{ . | toString | quote }}
  {{- end }}
  LIMITER_MAX_WAIT_MS: {{ $w.limiter.maxWaitMs | quote }}
  LIMITER_SCOPE: {{ $w.limiter.scope | quote }}
  {{- end }}
  {{- $a := .Values.agent }}
  AGENT_PROVIDER_TYPE: {{ $a.providerType | quote }}
  AGENT_MODEL: {{ $a.model | quote }}
  {{- with $a.baseUrl }}
  AGENT_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with $a.plannerModel }}
  AGENT_PLANNER_MODEL: {{ . | quote }}
  {{- end }}
  {{- with $a.synthesizerModel }}
  AGENT_SYNTHESIZER_MODEL: {{ . | quote }}
  {{- end }}
  {{- with $a.systemPrompt }}
  AGENT_SYSTEM_PROMPT: {{ . | quote }}
  {{- end }}
  AGENT_TOOL_APPROVAL: {{ $a.toolApproval | quote }}
  {{- with $a.toolRules }}
  AGENT_TOOL_RULES: {{ include "swarm.json" . | quote }}
  {{- end }}
  {{- with $a.mcpServers }}
  MCP_SERVERS: {{ include "swarm.json" . | quote }}
  {{- end }}
  {{- with $a.subagents }}
  SUBAGENTS: {{ include "swarm.json" . | quote }}
  {{- end }}
  AGENT_MAX_ITERATIONS: {{ $a.maxIterations | quote }}
  AGENT_MAX_STEPS_PER_TASK: {{ $a.maxStepsPerTask | quote }}
  AGENT_LOG_LEVEL: {{ $a.logLevel | quote }}
  {{- range $k, $v := $a.extra }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
