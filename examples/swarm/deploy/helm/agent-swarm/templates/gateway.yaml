{{- $g := .Values.gateway -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarm.component" (list . "gateway") }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not $g.autoscaling.enabled }}
  replicas: {{ $g.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "swarm.selector" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm.podLabels" (list . "gateway") | nindent 8 }}
        {{- with $g.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with $g.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "swarm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "swarm.podCommon" . | trim | nindent 6 }}
      terminationGracePeriodSeconds: {{ $g.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: {{ include "swarm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [gateway]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "swarm.component" (list . "common") }}
            - configMapRef:
                name: {{ include "swarm.component" (list . "gateway") }}
            {{- with $g.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "swarm.secretEnv" (list . "gateway") | trim | nindent 12 }}
            {{- with $g.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /readyz: Postgres, Temporal and the LISTEN connection answer. /healthz: the process runs.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          {{- if gt (int $g.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $g.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "swarm.mounts" . | nindent 12 }}
      volumes:
        {{- include "swarm.tmpVolume" . | nindent 8 }}
        {{- include "swarm.secretVolume" (list . "gateway") | nindent 8 }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarm.component" (list . "gateway") }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with $g.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $g.service.type }}
  selector:
    {{- include "swarm.selector" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ $g.service.port }}
      targetPort: http
      protocol: TCP
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "swarm.component" (list . "gateway") }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "swarm.component" (list . "gateway") }}
  minReplicas: {{ $g.autoscaling.minReplicas }}
  maxReplicas: {{ $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
