apiVersion: v2
name: agent-swarm
description: >-
  The swarm example of @dudko.dev/agent on Kubernetes - a stateless gateway, workers that run the
  agent's turns as Temporal activities, a migrate Job - against an external Postgres and a
  self-hosted Temporal.
type: application
# The chart's own version. Private example: not published to a chart repository.
version: 0.1.0
# The image tag used when image.tag is empty: the agent version this chart was last checked with
# (packages/agent/package.json; the image workflow tags the image with it).
appVersion: '0.0.50'
home: https://github.com/dudko-dev/agents/tree/main/examples/swarm
sources:
  - https://github.com/dudko-dev/agents
keywords:
  - agent
  - llm
  - temporal
dependencies:
  # The official Temporal chart (https://github.com/temporalio/helm-charts, repository
  # https://go.temporal.io/helm-charts), OFF by default: production points temporal.address at
  # a Temporal cluster that is run on its own. Version pinned; `helm dependency build` fetches it.
  - name: temporal
    version: 1.8.0
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
